<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>账号与卡池工坊 · 海克斯麻将</title>
  <style>
    :root{color-scheme:dark;--bg:#050b14;--panel:#0c1929;--panel2:#10243a;--line:#88cce626;--cyan:#76e8ff;--gold:#f9cb6b;--ink:#ecf7ff;--muted:#8ca2b6;--danger:#ff829d;font-family:"Microsoft YaHei","PingFang SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#163c5b55,transparent 38rem),radial-gradient(circle at 90% 0,#56327844,transparent 35rem),var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:24px 0 60px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.mark{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--gold);color:var(--gold);transform:rotate(45deg);box-shadow:0 0 22px #f9cb6b22}.mark span{transform:rotate(-45deg)}h1,h2,h3,p{margin-top:0}.brand h1{font:400 clamp(24px,4vw,36px) Georgia,"Microsoft YaHei",serif;margin:0}.brand small{display:block;margin-top:5px;color:var(--muted);font-size:9px;letter-spacing:.14em}.actions{display:flex;align-items:center;gap:8px}.btn,.link-btn{border:1px solid #76e8ff55;border-radius:6px;background:#76e8ff12;color:var(--cyan);padding:10px 14px;text-decoration:none}.btn:hover,.link-btn:hover{border-color:var(--cyan);background:#76e8ff20}.btn.gold{border-color:#f9cb6b88;background:#f9cb6b16;color:var(--gold)}.btn.danger{border-color:#ff829d55;background:#ff829d10;color:#ffb2c2}.btn:disabled{opacity:.4;cursor:not-allowed}.panel{border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#10243aee,#081421f5);box-shadow:0 20px 65px #0006}.auth{width:min(520px,100%);margin:8vh auto 0;padding:28px}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}.auth-tab{border:1px solid var(--line);background:#ffffff08;color:var(--muted);padding:11px;border-radius:6px}.auth-tab.active{border-color:#f9cb6b88;color:var(--gold);background:#f9cb6b12}.field{display:block;color:var(--muted);font-size:11px;margin-bottom:13px}.field input,.field textarea,.field select,.node input,.node select{display:block;width:100%;margin-top:6px;border:1px solid #8ea4bf44;border-radius:6px;background:#020a13aa;color:var(--ink);padding:11px;outline:none}.field textarea{min-height:96px;resize:vertical;line-height:1.65}.field input:focus,.field textarea:focus,.field select:focus,.node input:focus,.node select:focus{border-color:var(--cyan);box-shadow:0 0 0 2px #76e8ff12}.message{min-height:22px;margin-top:12px;color:var(--gold);font-size:11px}.message.error{color:var(--danger)}.hidden{display:none!important}.workspace{display:grid;grid-template-columns:360px minmax(0,1fr);gap:18px}.sidebar,.main{padding:20px}.account-line{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;padding-bottom:15px;border-bottom:1px solid var(--line)}.account-line strong{color:var(--gold)}.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}.section-title h2{font:400 23px Georgia,"Microsoft YaHei",serif;margin:0}.section-title span{color:var(--muted);font-size:10px}.stack{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:8px;background:#ffffff05;padding:12px}.item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.item h3{font-size:14px;margin:0;color:#f4fbff}.item small{display:block;color:var(--muted);margin-top:5px;line-height:1.5}.item-actions{display:flex;gap:6px;margin-top:10px}.mini{border:1px solid #8ea4bf33;border-radius:5px;background:#ffffff08;color:var(--muted);padding:6px 8px;font-size:10px}.mini:hover{color:var(--cyan);border-color:#76e8ff66}.mini.danger:hover{color:var(--danger);border-color:#ff829d66}.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{border:1px solid var(--line);border-radius:6px;background:#ffffff05;color:var(--muted);padding:9px 13px}.tab.active{border-color:#76e8ff77;color:var(--cyan);background:#76e8ff10}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .wide{grid-column:1/-1}.form-actions{display:flex;gap:8px;align-items:center;margin-top:4px}.preview{min-height:190px;border:1px solid #f9cb6b55;border-radius:10px;padding:16px;background:linear-gradient(145deg,#17334a,#11263e 46%,#34284d);box-shadow:inset 0 0 28px #76e8ff0d}.preview.challenge{border-color:#ff829d77;background:linear-gradient(145deg,#421f31,#22182a 55%,#2e1823)}.preview.prismatic{border-color:#ffe292cc;background:linear-gradient(145deg,#332558,#173d59 34%,#4d244e 66%,#493b17);box-shadow:0 0 25px #ca9aff33,inset 0 0 28px #ffe79714}.preview-code{color:var(--muted);font:10px Georgia,serif;letter-spacing:.12em}.preview-glyph{height:70px;display:grid;place-items:center;font:46px Georgia,serif;color:var(--gold);text-shadow:0 0 24px #76e8ffaa}.preview h3{font:400 22px Georgia,"Microsoft YaHei",serif;margin:7px 0}.preview p{color:#b9c9d7;font-size:11px;line-height:1.65;margin:0}.nodes{display:grid;gap:8px}.node{display:grid;grid-template-columns:36px 1fr 1.6fr 150px 34px;gap:8px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:8px;background:#ffffff04}.node-index{width:30px;height:30px;display:grid;place-items:center;border:1px solid #f9cb6b55;border-radius:50%;color:var(--gold);margin-bottom:2px}.node label{color:var(--muted);font-size:9px}.node input,.node select{margin-top:4px;padding:8px;font-size:11px}.remove-node{width:32px;height:32px;border:1px solid #ff829d44;border-radius:5px;background:#ff829d0b;color:var(--danger)}.library-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 10px}.library-tools input{flex:1;min-width:160px;border:1px solid #8ea4bf44;border-radius:6px;background:#020a13aa;color:var(--ink);padding:9px}.library{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:430px;overflow:auto;padding-right:3px}.pick{display:grid;grid-template-columns:22px 1fr;gap:8px;border:1px solid var(--line);border-radius:7px;padding:10px;background:#ffffff04}.pick.selected{border-color:#76e8ff77;background:#76e8ff0c}.pick input{margin-top:2px}.pick strong{font-size:12px}.pick small{display:block;margin-top:4px;color:var(--muted);font-size:9px;line-height:1.45}.badge{display:inline-block;margin-left:5px;padding:2px 5px;border:1px solid #f9cb6b44;border-radius:999px;color:var(--gold);font-size:8px}.empty{padding:18px;text-align:center;color:var(--muted);font-size:11px;border:1px dashed var(--line);border-radius:8px}.footnote{margin:11px 0 0;color:var(--muted);font-size:10px;line-height:1.6}@media(max-width:850px){.workspace{grid-template-columns:1fr}.sidebar{order:2}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.node{grid-template-columns:32px 1fr 34px}.node label:nth-of-type(2),.node label:nth-of-type(3){grid-column:2/-1}.library{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.actions{width:100%;justify-content:space-between}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><div class="mark"><span>✦</span></div><div><h1>账号与卡池工坊</h1><small>PRIVATE AUGMENT WORKSHOP</small></div></div><div class="actions"><a class="link-btn" href="./">返回大厅</a><button class="btn danger hidden" id="logoutBtn">退出登录</button></div></header>

    <section class="panel auth" id="authPanel">
      <div class="auth-tabs"><button class="auth-tab active" data-auth-mode="login">登录</button><button class="auth-tab" data-auth-mode="register">注册</button></div>
      <form id="authForm"><label class="field">用户名<input id="authUsername" maxlength="24" autocomplete="username" required placeholder="3～24 位文字或数字"></label><label class="field">账号密码<input id="authPassword" type="password" minlength="8" maxlength="72" autocomplete="current-password" required placeholder="至少 8 位"></label><button class="btn gold" id="authSubmit" type="submit">登录</button><div class="message" id="authMessage"></div></form>
    </section>

    <section class="workspace hidden" id="workspace">
      <aside class="panel sidebar"><div class="account-line"><span>当前账号</span><strong id="username"></strong></div><div class="section-title"><h2>我的收藏</h2><span id="cardCount">0 张</span></div><div class="stack" id="privateCardList"></div><div class="section-title" style="margin-top:24px"><h2>我的卡池</h2><span id="poolCount">0 个</span></div><div class="stack" id="poolList"></div></aside>
      <main class="panel main">
        <div class="tabs"><button class="tab active" data-tab="cards">DIY卡牌</button><button class="tab" data-tab="pools">卡池与节点</button></div>
        <section id="cardEditor">
          <div class="section-title"><h2 id="cardEditorTitle">创建私人卡牌</h2><span>仅当前账号可管理</span></div>
          <div class="form-grid"><div><label class="field">卡牌名称<input id="cardName" maxlength="30" placeholder="例如：命运重铸"></label><label class="field">卡面图标<input id="cardGlyph" maxlength="4" value="✦"></label><label class="field">稀有度<select id="cardRarity"><option value="standard">普通海克斯</option><option value="challenge">限制海克斯</option><option value="prismatic">棱彩海克斯</option></select></label><label class="field">建议出现时机<select id="cardTiming"><option value="any">所有节点</option><option value="opening">仅开局</option><option value="afterWin">有人胡牌后</option><option value="lateGame">牌局后期</option></select></label></div><div><div class="preview" id="cardPreview"><div class="preview-code">DIY CARD</div><div class="preview-glyph" id="previewGlyph">✦</div><h3 id="previewName">私人海克斯</h3><p id="previewEffect">填写效果后，这里会显示固定模板卡面。</p></div></div><label class="field wide">效果说明<textarea id="cardEffect" maxlength="500" placeholder="描述线下牌局需要执行的效果"></textarea></label></div>
          <div class="form-actions"><button class="btn gold" id="saveCard" type="button">保存卡牌</button><button class="btn hidden" id="cancelCard" type="button">取消编辑</button></div><div class="message" id="cardMessage"></div>
        </section>

        <section class="hidden" id="poolEditor">
          <div class="section-title"><h2 id="poolEditorTitle">创建私人卡池</h2><span>最多 5 个抽取节点</span></div>
          <div class="form-grid"><label class="field">卡池名称<input id="poolName" maxlength="30" placeholder="例如：朋友局疯狂模式"></label><label class="field">说明<input id="poolDescription" maxlength="160" placeholder="可选"></label></div>
          <div class="section-title" style="margin-top:12px"><h2>抽取节点</h2><button class="btn" id="addNode" type="button">增加节点</button></div><div class="nodes" id="nodes"></div>
          <div class="section-title" style="margin-top:22px"><h2>选择海克斯</h2><span id="selectedCount">已选 0 张</span></div>
          <div class="library-tools"><input id="cardSearch" placeholder="搜索卡牌名称"><button class="mini" id="selectOfficial" type="button">全选官方卡</button><button class="mini" id="clearSelection" type="button">清空</button></div><div class="library" id="cardLibrary"></div>
          <p class="footnote">系统根据官方节点标签或DIY卡的“建议出现时机”自动分配，不需要逐张设置。创建房间时会冻结节点、卡牌及效果版本。</p>
          <div class="form-actions"><button class="btn gold" id="savePool" type="button">保存卡池</button><button class="btn hidden" id="cancelPool" type="button">取消编辑</button></div><div class="message" id="poolMessage"></div>
        </section>
      </main>
    </section>
  </div>
  <script>
    const $=id=>document.getElementById(id);let authMode='login',csrfToken='',studio={user:null,officialCards:[],privateCards:[],pools:[],nodeTypes:[]},editingCardId=null,editingPoolId=null,poolNodes=[],selectedCards=new Map();
    const timingNames={any:'所有节点',opening:'仅开局',afterWin:'有人胡牌后',lateGame:'牌局后期'},rarityNames={standard:'普通',challenge:'限制',prismatic:'棱彩'};
    async function api(path,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(csrfToken&&options.method&&options.method!=='GET')headers['X-CSRF-Token']=csrfToken;const response=await fetch('./api'+path,{credentials:'same-origin',...options,headers});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.message||'请求失败');return data;}
    function message(id,text,error=false){const el=$(id);el.textContent=text||'';el.classList.toggle('error',!!error)}
    function setAuthMode(mode){authMode=mode;document.querySelectorAll('[data-auth-mode]').forEach(btn=>btn.classList.toggle('active',btn.dataset.authMode===mode));$('authSubmit').textContent=mode==='login'?'登录':'注册并登录';$('authPassword').autocomplete=mode==='login'?'current-password':'new-password';message('authMessage','')}
    async function loadStudio(){const data=await api('/studio');csrfToken=data.csrfToken;studio=data;$('username').textContent=data.user.username;$('authPanel').classList.add('hidden');$('workspace').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');renderLists();renderNodes();renderLibrary();}
    async function bootstrap(){try{const me=await api('/me');if(me.user){csrfToken=me.csrfToken;await loadStudio();}}catch(error){message('authMessage',error.message,true)}}
    function renderLists(){
      $('cardCount').textContent=studio.privateCards.length+' 张';$('poolCount').textContent=studio.pools.length+' 个';
      $('privateCardList').replaceChildren(...(studio.privateCards.length?studio.privateCards.map(card=>{const el=document.createElement('div');el.className='item';const head=document.createElement('div');head.className='item-head';const info=document.createElement('div'),title=document.createElement('h3'),meta=document.createElement('small');title.textContent=card.glyph+' '+card.name;meta.textContent=rarityNames[card.rarity]+' · '+timingNames[card.recommendedTiming];info.append(title,meta);head.append(info);const actions=document.createElement('div');actions.className='item-actions';actions.append(actionButton('编辑',()=>editCard(card)),actionButton('删除',()=>deleteCard(card),true));el.append(head,actions);return el;}):[emptyNode('还没有私人卡牌。')]));
      $('poolList').replaceChildren(...(studio.pools.length?studio.pools.map(pool=>{const el=document.createElement('div');el.className='item';const title=document.createElement('h3'),meta=document.createElement('small');title.textContent=pool.name;meta.textContent=pool.nodes.length+' 个节点 · '+pool.cards.length+' 张卡 · v'+pool.version;const actions=document.createElement('div');actions.className='item-actions';actions.append(actionButton('编辑',()=>editPool(pool)),actionButton('删除',()=>deletePool(pool),true));el.append(title,meta,actions);return el;}):[emptyNode('还没有私人卡池。')]));
    }
    function actionButton(label,handler,danger=false){const button=document.createElement('button');button.type='button';button.className='mini'+(danger?' danger':'');button.textContent=label;button.addEventListener('click',handler);return button}
    function emptyNode(text){const el=document.createElement('div');el.className='empty';el.textContent=text;return el}
    function updatePreview(){const rarity=$('cardRarity').value,preview=$('cardPreview');preview.className='preview'+(rarity==='challenge'?' challenge':rarity==='prismatic'?' prismatic':'');$('previewGlyph').textContent=$('cardGlyph').value.trim()||'✦';$('previewName').textContent=$('cardName').value.trim()||'私人海克斯';$('previewEffect').textContent=$('cardEffect').value.trim()||'填写效果后，这里会显示固定模板卡面。'}
    function resetCardForm(){editingCardId=null;$('cardEditorTitle').textContent='创建私人卡牌';$('cardName').value='';$('cardGlyph').value='✦';$('cardRarity').value='standard';$('cardTiming').value='any';$('cardEffect').value='';$('cancelCard').classList.add('hidden');message('cardMessage','');updatePreview()}
    function editCard(card){showTab('cards');editingCardId=card.id;$('cardEditorTitle').textContent='编辑 '+card.name;$('cardName').value=card.name;$('cardGlyph').value=card.glyph;$('cardRarity').value=card.rarity;$('cardTiming').value=card.recommendedTiming;$('cardEffect').value=card.effect;$('cancelCard').classList.remove('hidden');updatePreview();scrollTo({top:0,behavior:'smooth'})}
    async function saveCard(){try{const body={name:$('cardName').value,effect:$('cardEffect').value,glyph:$('cardGlyph').value,rarity:$('cardRarity').value,recommendedTiming:$('cardTiming').value};await api('/private-cards'+(editingCardId?'/'+editingCardId:''),{method:editingCardId?'PUT':'POST',body:JSON.stringify(body)});await loadStudio();resetCardForm();message('cardMessage','卡牌已保存。')}catch(error){message('cardMessage',error.message,true)}}
    async function deleteCard(card){if(!confirm('删除私人卡牌“'+card.name+'”？'))return;try{await api('/private-cards/'+card.id,{method:'DELETE'});await loadStudio()}catch(error){alert(error.message)}}
    function newNode(index,type='custom',name='新节点',description=''){return {id:'node_'+Date.now().toString(36)+'_'+index+'_'+Math.random().toString(36).slice(2,6),name,desc:description,type}}
    function resetPoolForm(){editingPoolId=null;$('poolEditorTitle').textContent='创建私人卡池';$('poolName').value='';$('poolDescription').value='';poolNodes=[newNode(1,'opening','开局','牌局开始前抽取'),newNode(2,'afterWin','第一家胡牌后','第一位玩家胡牌结算后抽取'),newNode(3,'afterWin','第二家胡牌后','第二位玩家胡牌结算后抽取')];selectedCards.clear();$('cancelPool').classList.add('hidden');message('poolMessage','');renderNodes();renderLibrary()}
    function renderNodes(){$('nodes').replaceChildren(...poolNodes.map((node,index)=>{const row=document.createElement('div');row.className='node';const number=document.createElement('div');number.className='node-index';number.textContent=index+1;row.append(number);row.append(nodeField('名称',node.name,value=>node.name=value),nodeField('节点说明',node.desc,value=>node.desc=value),nodeSelect(node.type,value=>node.type=value));const remove=document.createElement('button');remove.type='button';remove.className='remove-node';remove.textContent='×';remove.disabled=poolNodes.length<=1;remove.addEventListener('click',()=>{poolNodes.splice(index,1);renderNodes()});row.append(remove);return row;}));$('addNode').disabled=poolNodes.length>=5}
    function nodeField(label,value,onInput){const field=document.createElement('label');field.textContent=label;const input=document.createElement('input');input.value=value;input.maxLength=label==='名称'?18:80;input.addEventListener('input',()=>onInput(input.value));field.append(input);return field}
    function nodeSelect(value,onChange){const field=document.createElement('label');field.textContent='节点类型';const select=document.createElement('select');studio.nodeTypes.forEach(type=>{const option=document.createElement('option');option.value=type.id;option.textContent=type.name;select.append(option)});select.value=value;select.addEventListener('change',()=>onChange(select.value));field.append(select);return field}
    function cardKey(source,id){return source+'|'+id}
    function renderLibrary(){if(!$('cardLibrary'))return;const query=$('cardSearch').value.trim().toLowerCase(),items=[...studio.officialCards.map(card=>({source:'official',card})),...studio.privateCards.map(card=>({source:'private',card}))].filter(item=>!query||item.card.name.toLowerCase().includes(query));$('selectedCount').textContent='已选 '+selectedCards.size+' 张';$('cardLibrary').replaceChildren(...items.map(({source,card})=>{const key=cardKey(source,card.id),selected=selectedCards.has(key),label=document.createElement('label');label.className='pick'+(selected?' selected':'');const check=document.createElement('input');check.type='checkbox';check.checked=selected;check.addEventListener('change',()=>{if(check.checked)selectedCards.set(key,{source,id:card.id,assignmentMode:'auto',nodeIds:[]});else selectedCards.delete(key);renderLibrary()});const body=document.createElement('span'),name=document.createElement('strong'),meta=document.createElement('small');name.textContent=card.name;const badge=document.createElement('span');badge.className='badge';badge.textContent=source==='private'?'私人':'官方';name.append(badge);meta.textContent=(card.effect||'').slice(0,70);body.append(name,meta);label.append(check,body);return label;}))}
    function editPool(pool){showTab('pools');editingPoolId=pool.id;$('poolEditorTitle').textContent='编辑 '+pool.name;$('poolName').value=pool.name;$('poolDescription').value=pool.description;poolNodes=pool.nodes.map(node=>({...node}));selectedCards=new Map(pool.cards.map(ref=>[cardKey(ref.source,ref.id),{...ref}]));$('cancelPool').classList.remove('hidden');renderNodes();renderLibrary();scrollTo({top:0,behavior:'smooth'})}
    async function savePool(){try{const body={name:$('poolName').value,description:$('poolDescription').value,nodes:poolNodes,cards:[...selectedCards.values()]};await api('/pools'+(editingPoolId?'/'+editingPoolId:''),{method:editingPoolId?'PUT':'POST',body:JSON.stringify(body)});await loadStudio();resetPoolForm();message('poolMessage','卡池已保存，可以在创建房间时选择。')}catch(error){message('poolMessage',error.message,true)}}
    async function deletePool(pool){if(!confirm('删除私人卡池“'+pool.name+'”？'))return;try{await api('/pools/'+pool.id,{method:'DELETE'});await loadStudio()}catch(error){alert(error.message)}}
    function showTab(tab){document.querySelectorAll('[data-tab]').forEach(btn=>btn.classList.toggle('active',btn.dataset.tab===tab));$('cardEditor').classList.toggle('hidden',tab!=='cards');$('poolEditor').classList.toggle('hidden',tab!=='pools')}
    document.querySelectorAll('[data-auth-mode]').forEach(btn=>btn.addEventListener('click',()=>setAuthMode(btn.dataset.authMode)));document.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>showTab(btn.dataset.tab)));
    $('authForm').addEventListener('submit',async event=>{event.preventDefault();message('authMessage','处理中…');try{const data=await api('/auth/'+authMode,{method:'POST',body:JSON.stringify({username:$('authUsername').value,password:$('authPassword').value})});csrfToken=data.csrfToken;await loadStudio()}catch(error){message('authMessage',error.message,true)}});
    $('logoutBtn').addEventListener('click',async()=>{try{await api('/auth/logout',{method:'POST'});}finally{location.reload()}});['cardName','cardGlyph','cardEffect'].forEach(id=>$(id).addEventListener('input',updatePreview));$('cardRarity').addEventListener('change',updatePreview);$('saveCard').addEventListener('click',saveCard);$('cancelCard').addEventListener('click',resetCardForm);$('addNode').addEventListener('click',()=>{if(poolNodes.length<5){poolNodes.push(newNode(poolNodes.length+1));renderNodes()}});$('cardSearch').addEventListener('input',renderLibrary);$('selectOfficial').addEventListener('click',()=>{studio.officialCards.forEach(card=>selectedCards.set(cardKey('official',card.id),{source:'official',id:card.id,assignmentMode:'auto',nodeIds:[]}));renderLibrary()});$('clearSelection').addEventListener('click',()=>{selectedCards.clear();renderLibrary()});$('savePool').addEventListener('click',savePool);$('cancelPool').addEventListener('click',resetPoolForm);
    resetPoolForm();updatePreview();bootstrap();
  </script>
</body>
</html>
