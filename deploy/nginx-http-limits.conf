# Install inside nginx's http {} context, not inside server {}.
limit_req_zone $binary_remote_addr zone=hex_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=hex_auth:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=hex_ws:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=hex_connections:10m;
