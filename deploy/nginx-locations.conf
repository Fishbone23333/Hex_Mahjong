# Replace only the mahjong locations in the existing HTTPS server; keep the other app intact.
# Unknown Host for this application returns 421 in Node (ALLOWED_ORIGINS).
location ^~ /hex-mahjong/api/auth/ {
    limit_req zone=hex_auth burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    include /etc/nginx/snippets/hex-mahjong-proxy.conf;
}
location ^~ /hex-mahjong/api/ {
    limit_req zone=hex_api burst=25 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    include /etc/nginx/snippets/hex-mahjong-proxy.conf;
}
location = /hex-mahjong/ {
    limit_req zone=hex_ws burst=20 nodelay;
    limit_req_status 429;
    limit_conn hex_connections 30;
    include /etc/nginx/snippets/hex-mahjong-proxy.conf;
}
location /hex-mahjong/ {
    include /etc/nginx/snippets/hex-mahjong-proxy.conf;
}
